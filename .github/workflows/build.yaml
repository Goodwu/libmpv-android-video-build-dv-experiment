name: Current-source Android native candidate
on:
  push:
    branches:
      - feature/android-dv
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routing-native-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    name: Build unreviewed current-source native candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      EXPECTED_RECIPE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the exact candidate before setup
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RECIPE_SHA"
          mkdir -p "$RUNNER_TEMP/native-setup"
          printf 'recipe=%s\nrun=%s\nattempt=%s\nnativeVerified=false\ndeviceVerified=false\n' "$EXPECTED_RECIPE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/native-setup/source.txt"
      - name: Install host compilation and real ELF test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib autoconf automake libtool pkg-config nasm ninja-build cmake clang lld binutils python3-venv python3-jsonschema python3-jinja2 wget unzip zip
          python3 -m venv "$RUNNER_TEMP/native-python"
          "$RUNNER_TEMP/native-python/bin/pip" install meson jinja2 jsonschema
          "$RUNNER_TEMP/native-python/bin/pip" freeze > "$RUNNER_TEMP/native-setup/python-tools.txt"
          printf '%s\n' "$RUNNER_TEMP/native-python/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Install the recipe-selected NDK in the hosted SDK
        run: |
          set -euo pipefail
          export ENCODERS_GPL=${ENCODERS_GPL:-}
          . buildscripts/include/depinfo.sh
          test -d "$ANDROID_HOME"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          # Use existing hosted SDK licenses. Missing licenses fail here;
          # do not invoke the old container action's ten-second license timeout.
          "$manager" --sdk_root="$ANDROID_HOME" "ndk;$v_ndk" 'platforms;android-35' "build-tools;$v_sdk_build_tools" 'cmake;3.22.1' </dev/null 2>&1 | tee "$RUNNER_TEMP/native-setup/sdk-install.log"
          test -f "$ANDROID_HOME/ndk/$v_ndk/source.properties"
          mkdir buildscripts/sdk
          ln -s "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux
      - name: Validate all host contracts before the native build
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/native-setup/contracts.log"
          bash -n buildscripts/bundle_default.sh
          git diff --exit-code
      - name: Build and package one fresh current-source vector
        id: build
        run: |
          set -euo pipefail
          # Preserve the complete driver error too, not only nested build logs.
          bash buildscripts/bundle_default.sh 2>&1 | tee "$RUNNER_TEMP/native-setup/bundle.log"
      - name: Collect successful packaging records without changing approval
        if: ${{ success() }}
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "buildscripts/routing-native-output/$abi/packaging.json" "buildscripts/routing-native-evidence/packaging-$abi.json"
          done
      - name: Collect the complete runtime and relocatable development SDK
        if: ${{ success() }}
        run: |
          set -euo pipefail
          export ENCODERS_GPL=${ENCODERS_GPL:-}
          . buildscripts/include/depinfo.sh
          python3 buildscripts/scripts/package_native_bundle.py \
            --build-root buildscripts --output buildscripts/routing-native-package \
            --android-api "$v_android_api"
          # Preserve the SDK's reviewed relative symlinks in the artifact.
          tar -C buildscripts/routing-native-package -czf buildscripts/routing-native-package.tar.gz root spec.json README.txt
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: routing-native-package-${{ env.EXPECTED_RECIPE_SHA }}
          path: buildscripts/routing-native-package.tar.gz
          if-no-files-found: error
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: routing-native-arm64-${{ env.EXPECTED_RECIPE_SHA }}
          path: buildscripts/routing-native-output/arm64-v8a/default-arm64-v8a.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: routing-native-other-abis-${{ env.EXPECTED_RECIPE_SHA }}
          path: |
            buildscripts/routing-native-output/armeabi-v7a/*.jar
            buildscripts/routing-native-output/x86/*.jar
            buildscripts/routing-native-output/x86_64/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-native-evidence-${{ env.EXPECTED_RECIPE_SHA }}
          path: |
            ${{ runner.temp }}/native-setup
            buildscripts/routing-native-evidence
            !buildscripts/routing-native-evidence/prepared/**
          if-no-files-found: error
